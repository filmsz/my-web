<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙️ ตั้งค่าโปรเจกต์ ⚙️</title>
<link rel="icon" type="image/png" sizes="64x64" href="logo.png">
<style>
  :root {
    --bg-main: #111418;
    --bg-grad: #161A1D;
    --card: #1F2327;
    --field: #161A1D;
    --field-hover: #1b2024;
    --ink: #EDEDED;
    --muted: #A0A8B0;
    --accent-gold: #C2A675;
    --accent-gold-hover: #d1b88a;
    --accent-sage: #8F9E8B;
    --line: #2C3238;
    --err: #E07A68;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: "Sarabun", "Noto Sans Thai", "Prompt", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top, var(--bg-grad) 0%, var(--bg-main) 100%);
    color: var(--ink);
    padding: 16px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.5;
  }
  .ss-card {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 2px solid var(--accent-gold);
    border-radius: 16px;
    padding: 22px 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
  }
  .ss-logo {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    vertical-align: middle;
  }
  .ss-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .ss-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-gold);
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ss-meta {
    font-size: 13.5px;
    color: var(--accent-sage);
    background: rgba(143, 158, 139, 0.12);
    border: 1px solid rgba(143, 158, 139, 0.3);
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 500;
  }
  .ss-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .ss-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  label {
    display: block;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  select {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--field);
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  }
  select:hover {
    background: var(--field-hover);
    border-color: #3d454d;
  }
  select:focus {
    border-color: var(--accent-gold);
    box-shadow: 0 0 0 3px rgba(194, 166, 117, 0.18);
  }
  .ss-time-picker {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ss-time-picker select {
    flex: 1;
    text-align: center;
  }
  .ss-time-picker span {
    font-weight: 700;
    color: var(--muted);
    font-size: 18px;
  }
  .ss-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .ss-status {
    font-size: 14px;
    color: var(--accent-sage);
    flex: 1;
    min-width: 200px;
  }
  .ss-status.err {
    color: var(--err);
    font-weight: 500;
  }
  .ss-btn {
    height: 44px;
    padding: 0 24px;
    border: 0;
    border-radius: 10px;
    background: var(--accent-gold);
    color: #111418;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.2s ease, transform 0.1s ease;
    box-shadow: 0 4px 14px rgba(194, 166, 117, 0.25);
  }
  .ss-btn:hover {
    background: var(--accent-gold-hover);
  }
  .ss-btn:active {
    transform: translateY(1px);
  }
  .ss-btn:disabled {
    opacity: 0.55;
    cursor: default;
  }
  .ss-fallback {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    display: none;
  }
  .ss-fallback.show {
    display: flex;
    gap: 8px;
  }
  .ss-fallback input {
    flex: 1;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
    color: var(--ink);
    font-size: 13.5px;
    outline: none;
  }
  .ss-copy {
    height: 40px;
    padding: 0 16px;
    border: 1px solid var(--accent-gold);
    border-radius: 8px;
    background: rgba(194, 166, 117, 0.12);
    color: var(--accent-gold);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.2s ease;
  }
  .ss-copy:hover {
    background: rgba(194, 166, 117, 0.24);
  }
  @media (max-width: 560px) {
    body {
      padding: 10px;
    }
    .ss-card {
      padding: 18px 16px;
    }
    .ss-grid {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .ss-bar {
      flex-direction: column;
      align-items: stretch;
    }
    .ss-btn {
      width: 100%;
    }
    .ss-fallback.show {
      flex-direction: column;
    }
  }
</style>
</head>
<body>
<div class="ss-card" id="ss-root">
  <div class="ss-top">
    <span class="ss-title">
      <img src="logo.png" alt="FilmsZ Studio Logo" class="ss-logo">
      ⚙️ ตั้งค่าโปรเจกต์ ⚙️
    </span>
    <span class="ss-meta" id="ss-est">📝 ≈ 760 ตัวอักษร · 🖼️ 24 ภาพ · 🎬 5 ฉาก</span>
  </div>
  <div class="ss-grid">
    <div class="ss-field">
      <label for="ss-cat">1. หมวดเรื่อง</label>
      <select id="ss-cat">
        <option value="" selected disabled>-- เลือกหมวดเรื่อง --</option>
        <option value="ความรัก & ความสัมพันธ์ซับซ้อน">💔 ความรัก & ความสัมพันธ์ซับซ้อน</option>
        <option value="ฮีลใจ & กำลังใจการใช้ชีวิต">🌱 ฮีลใจ & กำลังใจการใช้ชีวิต</option>
        <option value="เทพ เทวดา ปีศาจ & ตำนานความเชื่อ">👁️ เทพ เทวดา ปีศาจ & ตำนานความเชื่อ</option>
        <option value="คดีปริศนา & เรื่องจริงชวนสงสัย">🔍 คดีปริศนา & เรื่องจริงชวนสงสัย</option>
      </select>
    </div>
    <div class="ss-field">
      <label for="ss-style">2. สไตล์การเล่า (เปลี่ยนได้)</label>
      <select id="ss-style">
        <option value="" selected disabled>-- เลือกสไตล์การเล่า --</option>
      </select>
    </div>
    <div class="ss-field">
      <label for="ss-size">3. ขนาดคลิป</label>
      <select id="ss-size">
        <option value="9:16" selected>📱 9:16 (แนวตั้ง Shorts/Reels/TikTok)</option>
        <option value="16:9">🖥️ 16:9 (แนวนอน YouTube)</option>
        <option value="1:1">⏹️ 1:1 (จัตุรัส)</option>
        <option value="4:5">🖼️ 4:5 (แนวตั้งโซเชียล)</option>
        <option value="3:4">🎴 3:4 (แนวตั้งมาตรฐาน)</option>
      </select>
    </div>
    <div class="ss-field">
      <label for="ss-ep">4. จำนวนตอน</label>
      <select id="ss-ep">
        <option value="1" selected>1 EP</option>
        <option value="2">2 EP</option>
        <option value="3">3 EP</option>
        <option value="4">4 EP</option>
        <option value="5">5 EP</option>
        <option value="6">6 EP</option>
        <option value="7">7 EP</option>
        <option value="8">8 EP</option>
        <option value="9">9 EP</option>
        <option value="10">10 EP</option>
        <option value="11">11 EP</option>
        <option value="12">12 EP</option>
        <option value="13">13 EP</option>
        <option value="14">14 EP</option>
        <option value="15">15 EP</option>
        <option value="16">16 EP</option>
        <option value="17">17 EP</option>
        <option value="18">18 EP</option>
        <option value="19">19 EP</option>
        <option value="20">20 EP</option>
      </select>
    </div>
    <div class="ss-field">
      <label>5. ความยาว</label>
      <div class="ss-time-picker">
        <select id="ss-min">
          <option value="00">00</option>
          <option value="01" selected>01</option>
          <option value="02">02</option>
          <option value="03">03</option>
          <option value="04">04</option>
          <option value="05">05</option>
          <option value="06">06</option>
          <option value="07">07</option>
          <option value="08">08</option>
          <option value="09">09</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="17">17</option>
          <option value="18">18</option>
          <option value="19">19</option>
          <option value="20">20</option>
        </select>
        <span>:</span>
        <select id="ss-sec">
          <option value="00" selected>00</option>
          <option value="30">30</option>
        </select>
      </div>
    </div>
    <div class="ss-field">
      <label for="ss-vid">6. จำนวนวิดีโอ</label>
      <select id="ss-vid">
        <!-- JS จะสร้างตัวเลือกอัตโนมัติตามความยาว -->
      </select>
    </div>
  </div>
  <div class="ss-bar">
    <span class="ss-status" id="ss-status">✨ เลือกหมวดเรื่องเพื่อรับคำแนะนำสไตล์อัตโนมัติ</span>
    <button type="button" class="ss-btn" id="ss-send">🚀 ส่งข้อมูล</button>
  </div>
  <div class="ss-fallback" id="ss-fb">
    <input type="text" id="ss-out" readonly>
    <button type="button" class="ss-copy" id="ss-copy">📋 คัดลอก</button>
  </div>
</div>
<script>
(() => {
  // แยกอิโมจิออกมาเพื่อให้ value ส่งค่าไปแค่ข้อความ
  const styleEmojis = {
    "ดราม่าสะเทือนอารมณ์": "😭",
    "แฉ/เตือนภัย": "⚠️",
    "ตลกร้าย/จิกกัด": "😏",
    "เรียบง่าย/เล่าประสบการณ์": "☕",
    "อบอุ่น/ฮีลใจ": "🫂",
    "ปรัชญา/สโตอิก": "🧘",
    "ให้กำลังใจ/ฮึกเหิม": "🔥",
    "เล่าแบบเพื่อนคุยกัน": "💬",
    "ลึกลับ/น่าเกรงขาม": "🌑",
    "เล่านิทาน/แฟนตาซี": "🧚",
    "สยองขวัญ/ระทึกขวัญ": "😱",
    "สารคดี/กึ่งประวัติศาสตร์": "📜",
    "สืบสวน/ระทึกขวัญ": "🕵️",
    "สารคดี/เจาะลึก": "📁",
    "ดาร์ก/หักมุม": "🔪",
    "ตื่นเต้น/เล่าข่าว": "🚨"
  };

  const styleMap = {
    "ความรัก & ความสัมพันธ์ซับซ้อน": ["ดราม่าสะเทือนอารมณ์", "แฉ/เตือนภัย", "ตลกร้าย/จิกกัด", "เรียบง่าย/เล่าประสบการณ์"],
    "ฮีลใจ & กำลังใจการใช้ชีวิต": ["อบอุ่น/ฮีลใจ", "ปรัชญา/สโตอิก", "ให้กำลังใจ/ฮึกเหิม", "เล่าแบบเพื่อนคุยกัน"],
    "เทพ เทวดา ปีศาจ & ตำนานความเชื่อ": ["ลึกลับ/น่าเกรงขาม", "เล่านิทาน/แฟนตาซี", "สยองขวัญ/ระทึกขวัญ", "สารคดี/กึ่งประวัติศาสตร์"],
    "คดีปริศนา & เรื่องจริงชวนสงสัย": ["สืบสวน/ระทึกขวัญ", "สารคดี/เจาะลึก", "ดาร์ก/หักมุม", "ตื่นเต้น/เล่าข่าว"]
  };

  const recMap = {
    "ความรัก & ความสัมพันธ์ซับซ้อน": "ดราม่าสะเทือนอารมณ์",
    "ฮีลใจ & กำลังใจการใช้ชีวิต": "อบอุ่น/ฮีลใจ",
    "เทพ เทวดา ปีศาจ & ตำนานความเชื่อ": "ลึกลับ/น่าเกรงขาม",
    "คดีปริศนา & เรื่องจริงชวนสงสัย": "สืบสวน/ระทึกขวัญ"
  };

  const cat = document.getElementById('ss-cat');
  const style = document.getElementById('ss-style');
  const size = document.getElementById('ss-size');
  const ep = document.getElementById('ss-ep');
  const min = document.getElementById('ss-min');
  const sec = document.getElementById('ss-sec');
  const vid = document.getElementById('ss-vid');
  const est = document.getElementById('ss-est');
  const status = document.getElementById('ss-status');
  const send = document.getElementById('ss-send');
  const fb = document.getElementById('ss-fb');
  const out = document.getElementById('ss-out');
  const copy = document.getElementById('ss-copy');

  let initialSetup = true;

  function updateEstDisplay() {
    const m = Number(min.value) + (Number(sec.value) / 60);
    const totalImages = Math.round(m * 24);
    let vidText = `${vid.value} ฉาก`;
    if (vid.value === 'ทั้งหมดทุกฉาก') {
      vidText = `ทั้งหมดทุกฉาก`;
    }
    est.textContent = `📝 ≈ ${(Math.round(m * 760)).toLocaleString('en-US')} ตัวอักษร · 🖼️ ${totalImages} ภาพ · 🎬 ${vidText}`;
  }

  function updateStyles() {
    const catValue = cat.value;
    style.innerHTML = '';
    
    if (styleMap[catValue]) {
      styleMap[catValue].forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; // เก็บค่าส่งข้อมูลแบบไม่มีอิโมจิ
        opt.textContent = `${styleEmojis[s]} ${s}`; // แสดงผลมีอิโมจิ
        style.appendChild(opt);
      });
    } else {
      const opt = document.createElement('option');
      opt.value = "";
      opt.textContent = "-- เลือกสไตล์การเล่า --";
      opt.disabled = true;
      opt.selected = true;
      style.appendChild(opt);
    }
  }

  function rebuildVideoOptions() {
    const m = Number(min.value) + (Number(sec.value) / 60);
    const totalImages = Math.round(m * 24);
    const prevValue = vid.value;
    vid.innerHTML = '';

    const maxScenes = totalImages > 0 ? totalImages : 1; 

    for (let i = 1; i <= maxScenes; i++) {
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = `${i} ฉาก`;
      vid.appendChild(opt);
    }

    const tsOpt = document.createElement('option');
    tsOpt.value = 'ทั้งหมดทุกฉาก';
    tsOpt.textContent = 'ทั้งหมดทุกฉาก';
    vid.appendChild(tsOpt);

    if (initialSetup) {
      vid.value = (maxScenes >= 5) ? '5' : 'ทั้งหมดทุกฉาก';
      initialSetup = false;
    } else if (prevValue === 'ทั้งหมดทุกฉาก') {
      vid.value = 'ทั้งหมดทุกฉาก';
    } else if (Number(prevValue) >= 1 && Number(prevValue) <= maxScenes) {
      vid.value = prevValue;
    } else {
      vid.value = (maxScenes >= 5) ? '5' : 'ทั้งหมดทุกฉาก';
    }
    updateEstDisplay();
  }

  cat.addEventListener('change', () => {
    updateStyles();
    const recommended = recMap[cat.value];
    if (recommended) {
      style.value = recommended;
      status.classList.remove('err');
      status.textContent = `✨ แนะนำสไตล์: ${styleEmojis[recommended]} ${recommended} (เปลี่ยนได้)`;
    }
  });

  min.addEventListener('change', rebuildVideoOptions);
  sec.addEventListener('change', rebuildVideoOptions);
  vid.addEventListener('change', updateEstDisplay);

  send.addEventListener('click', async () => {
    if (!cat.value || !style.value) {
      status.classList.add('err');
      status.textContent = '⚠️ กรุณาเลือกหมวดเรื่องและสไตล์การเล่าก่อนส่งข้อมูล';
      return;
    }
    status.classList.remove('err');
    
    const durationText = `${min.value}:${sec.value}`;
    
    // จัดการข้อความของจำนวนวิดีโอตอนส่งข้อมูล
    let finalVidText = vid.value;
    if (finalVidText !== 'ทั้งหมดทุกฉาก') {
      finalVidText += ' ฉาก';
    }

    const text = `[STEP1] หมวด: ${cat.value} | สไตล์: ${style.value} | ขนาด: ${size.value} | EP: ${ep.value} | นาที/EP: ${durationText} นาที | จำนวนวิดีโอ: ${finalVidText}`;
    out.value = text;
    fb.classList.add('show');

    const bridge = window.openai;
    if (typeof bridge?.sendFollowUpMessage === 'function') {
      send.disabled = true;
      status.textContent = '⏳ กำลังส่งข้อมูลไปประมวลผล...';
      try {
        await bridge.sendFollowUpMessage({ prompt: text });
        status.textContent = '✅ ส่งข้อมูลแล้ว';
        return;
      } catch (e) {
        send.disabled = false;
      }
    }
    try {
      await navigator.clipboard.writeText(text);
      status.textContent = '✅ คัดลอกคำสั่งแล้ว วางส่งในแชตได้เลย';
    } catch (e) {
      status.textContent = '👇 กดปุ่มคัดลอกด้านล่างเพื่อส่งในแชต';
    }
  });

  copy.addEventListener('click', async () => {
    out.select();
    try {
      await navigator.clipboard.writeText(out.value);
      status.textContent = '✅ คัดลอกแล้ว วางในแชตได้เลย';
    } catch (e) {
      document.execCommand('copy');
      status.textContent = '✅ คัดลอกแล้ว';
    }
  });

  // Initialize
  rebuildVideoOptions();
  updateEstDisplay();
})();
</script>
</body>
</html>
